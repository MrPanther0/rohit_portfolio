user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;
    client_max_body_size 60m;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/wasm
        image/svg+xml font/woff font/woff2;

    # ── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Proxy headers are declared once here and inherited by every location.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream api_upstream {
        server api:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Once certificates are mounted, switch this to a permanent redirect:
        # return 301 https://$host$request_uri;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Uploaded assets are served straight from disk, bypassing Node entirely.
        location /api/static/ {
            alias /var/www/uploads/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Resource-Policy "cross-origin";
            access_log off;
            try_files $uri =404;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api_upstream;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_upstream;
        }

        # Next.js build output is content-hashed and safe to cache forever.
        location /_next/static/ {
            proxy_pass http://web_upstream;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://web_upstream;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    # Drop fullchain.pem and privkey.pem into ./nginx/certs, uncomment this
    # server, and copy the location blocks above into it.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # }
}
