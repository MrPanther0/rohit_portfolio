<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sign in</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%232438ff'/%3E%3Ctext x='50' y='72' font-size='62' font-weight='bold' text-anchor='middle' font-family='Georgia' fill='%23f2efe6'%3ER%3C/text%3E%3C/svg%3E">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-body">
  <form class="login-card" id="loginForm">
    <div class="login-brand">ROHIT<span>.</span></div>
    <h1 class="login-title">Studio Admin</h1>
    <p class="login-sub">Sign in to publish new work to your portfolio.</p>
    <input class="input" type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button class="btn-primary" type="submit" id="loginBtn">Enter studio →</button>
    <p class="login-error" id="loginError" hidden>Wrong password — try again.</p>
    <a class="login-back" href="/">← Back to site</a>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Checking…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        if (res.ok) { location.reload(); return; }
        err.hidden = false;
        form.classList.remove('shake');
        void form.offsetWidth;
        form.classList.add('shake');
      } catch {
        err.textContent = 'Could not reach the server.';
        err.hidden = false;
      }
      btn.disabled = false;
      btn.textContent = 'Enter studio →';
    });
  </script>
</body>
</html>
